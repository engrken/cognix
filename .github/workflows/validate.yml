name: Validate Cognix

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cognix-phase-validation-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: Phase validation — typecheck, lint, tests, production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Complete Phase 2 synthetic suite
        run: npm run test:phase2
      - name: Next.js production build
        run: npm run build
